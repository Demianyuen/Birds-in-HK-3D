<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="data:," />
    <title>留言管理 · Birds in HK</title>
  </head>
  <body>
    <main class="moderation">
      <h1>留言管理</h1>
      <p class="moderation-intro">分享後，留言會在花旁邊顯示給所有人。不合適的留言可以不分享；花本身仍然保留，除非你選擇隱藏。</p>
      <form id="token-form" class="token-form">
        <label>管理密碼 <input id="token" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" required /></label>
        <label id="code-row" hidden>驗證碼 <input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" maxlength="7" placeholder="6 位數字" /></label>
        <button type="submit">登入</button>
      </form>
      <details id="two-step-setup" class="two-step-setup">
        <summary>設定雙重認證</summary>
        <p class="meta">用手機的驗證程式（Google Authenticator、Microsoft Authenticator，或 iPhone「密碼」App）掃描下面的二維碼。這串密鑰只在你的瀏覽器產生，不會傳到任何地方。</p>
        <button type="button" id="two-step-make">產生新的密鑰</button>
        <div id="two-step-out" hidden>
          <canvas id="two-step-qr" width="220" height="220" aria-label="雙重認證二維碼"></canvas>
          <p class="meta">無法掃描時，在驗證程式選「輸入設定金鑰」，輸入：</p>
          <p><code id="two-step-key"></code></p>
          <label>掃描後，輸入程式顯示的 6 位數字確認 <input id="two-step-check" inputmode="numeric" maxlength="7" /></label>
          <p id="two-step-result" class="meta" role="status"></p>
        </div>
      </details>
      <section id="quiet-panel" class="quiet-panel" hidden>
        <div>
          <strong>安靜模式</strong>
          <p id="quiet-state" class="meta"></p>
        </div>
        <button type="button" id="quiet-toggle"></button>
      </section>
      <section id="speech-panel" class="quiet-panel" hidden>
        <div>
          <strong>小鳥說的話</strong>
          <p id="speech-state" class="meta"></p>
        </div>
        <button type="button" id="speech-toggle"></button>
      </section>
      <section id="gather-panel" class="quiet-panel" hidden>
        <div>
          <strong>舊廣場的花</strong>
          <p id="gather-state" class="meta"></p>
        </div>
        <button type="button" id="gather-move">搬到新廣場</button>
      </section>
      <p id="status" role="status"></p>
      <nav class="tabs" hidden id="tabs">
        <button type="button" data-view="pending" aria-pressed="true">等待分享</button>
        <button type="button" data-view="shared" aria-pressed="false">已分享</button>
        <button type="button" data-view="chat" aria-pressed="false">最近對話</button>
        <button type="button" data-view="feedback" aria-pressed="false">意見 <span id="feedback-badge" class="badge" hidden></span></button>
        <button type="button" data-view="status" aria-pressed="false">運作狀況</button>
      </nav>
      <ol id="items" class="items"></ol>
    </main>
    <script type="module" src="/src/moderation/main.ts"></script>
  </body>
</html>
