<!doctype html>
<html lang="zh-HK">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LandsD 實景預覽</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #9fb7c6; overflow: hidden; font-family: Inter, "Segoe UI", system-ui, sans-serif; }
      canvas { display: block; }
      #panel { position: absolute; left: 12px; top: 12px; width: min(360px, calc(100vw - 24px)); max-height: calc(100vh - 24px); overflow: auto;
        background: rgba(10, 20, 26, 0.82); color: #e9f1ee; border-radius: 6px; padding: 12px 14px; font-size: 12px; line-height: 1.55; }
      #panel h1 { margin: 0 0 4px; font-size: 14px; }
      #panel p { margin: 4px 0; }
      #panel pre { white-space: pre-wrap; word-break: break-all; margin: 6px 0 0; font-size: 11px; color: #bcd0ca; max-height: 220px; overflow: auto; }
      #views { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
      #views button { font: inherit; padding: 4px 9px; border-radius: 4px; border: 1px solid #6f8d86; background: #1d3138; color: #fff; cursor: pointer; }
      #status { color: #ffe1a6; }
    </style>
  </head>
  <body>
    <div id="panel">
      <h1>地政總署 3D 實景模型 · 宏福苑預覽</h1>
      <p>用來確認航拍外貌的年份（火災前或後）。拖曳旋轉，滾輪縮放，右鍵平移。</p>
      <div id="views">
        <button type="button" data-view="aerial">空中斜看</button>
        <button type="button" data-view="low">低空</button>
        <button type="button" data-view="street">街道</button>
        <button type="button" data-view="top">正上方</button>
      </div>
      <p id="status">連接中…</p>
      <p id="stats"></p>
      <pre id="asset"></pre>
    </div>
    <script type="module" src="/src/landsdPreview/main.ts"></script>
  </body>
</html>
